<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            padding: 32px;
        }

        h1 {
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 24px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .input-group button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .input-group button:hover {
            background: #5a6fd6;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .todo-item:hover {
            background: #f0f1f4;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #1a1a2e;
            word-break: break-word;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: #fee2e2;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

        .empty-state p {
            font-size: 16px;
        }

        .todo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e0e0e0;
            color: #6b7280;
            font-size: 14px;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: #fee2e2;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-row h1 {
            margin-bottom: 0;
        }

        .dark-mode-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
            line-height: 1;
        }

        .dark-mode-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Dark mode styles */
        .container.dark-mode {
            background: #1a1a2e;
        }

        .container.dark-mode h1 {
            color: #e0e0e0;
        }

        .container.dark-mode .input-group input {
            background: #2d2d44;
            border-color: #3d3d5c;
            color: #e0e0e0;
        }

        .container.dark-mode .input-group input:focus {
            border-color: #667eea;
        }

        .container.dark-mode .input-group input::placeholder {
            color: #6b7280;
        }

        .container.dark-mode .todo-item {
            background: #2d2d44;
        }

        .container.dark-mode .todo-item:hover {
            background: #363652;
        }

        .container.dark-mode .todo-text {
            color: #e0e0e0;
        }

        .container.dark-mode .todo-item.completed .todo-text {
            color: #6b7280;
        }

        .container.dark-mode .todo-footer {
            border-top-color: #3d3d5c;
            color: #9ca3af;
        }

        .container.dark-mode .empty-state p {
            color: #6b7280;
        }

        .container.dark-mode .dark-mode-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>📝 Todo App</h1>
            <button id="darkModeToggle" class="dark-mode-btn" onclick="toggleDarkMode()" aria-label="Toggle dark mode">🌙</button>
        </div>

        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Add a new task..." autofocus>
            <button onclick="addTodo()">Add</button>
        </div>

        <ul class="todo-list" id="todoList">
            <li class="empty-state">
                <p>No tasks yet. Add one above!</p>
            </li>
        </ul>

        <div class="todo-footer" id="todoFooter" style="display: none;">
            <span id="taskCount">0 tasks remaining</span>
            <button class="clear-btn" onclick="clearCompleted()">Clear completed</button>
        </div>
    </div>

    <script>
        let todos = [];

        function render() {
            const list = document.getElementById('todoList');
            const footer = document.getElementById('todoFooter');
            const count = document.getElementById('taskCount');

            if (todos.length === 0) {
                list.innerHTML = '<li class="empty-state"><p>No tasks yet. Add one above!</p></li>';
                footer.style.display = 'none';
                return;
            }

            footer.style.display = 'flex';
            const remaining = todos.filter(t => !t.completed).length;
            count.textContent = `${remaining} task${remaining !== 1 ? 's' : ''} remaining`;

            list.innerHTML = todos.map((todo, index) => `
                <li class="todo-item ${todo.completed ? 'completed' : ''}">
                    <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${index})">
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    <button class="delete-btn" onclick="deleteTodo(${index})">&times;</button>
                </li>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (text === '') return;
            todos.push({ text, completed: false });
            input.value = '';
            input.focus();
            render();
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            render();
        }

        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            render();
        }

        function clearCompleted() {
            todos = todos.filter(t => !t.completed);
            render();
        }

        document.getElementById('todoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTodo();
        });

        function toggleDarkMode() {
            const container = document.querySelector('.container');
            container.classList.toggle('dark-mode');
            const btn = document.getElementById('darkModeToggle');
            const isDark = container.classList.contains('dark-mode');
            btn.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('darkMode', isDark);
        }

        // Load dark mode preference
        if (localStorage.getItem('darkMode') === 'true') {
            document.querySelector('.container').classList.add('dark-mode');
            document.getElementById('darkModeToggle').textContent = '☀️';
        }
    </script>
</body>
</html>
